name: Gloam CI

on:
  push:
    branches: [gloam]
  pull_request:
    branches: [gloam]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
