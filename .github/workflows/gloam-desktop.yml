name: Gloam Desktop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        run: bun install
      - name: Prepare (embedded CLI + icons + version)
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: 0.0.0-gloam
          OPENCODE_CHANNEL: dev
      - name: Build (electron-vite)
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: dev
      - name: Package Windows (unsigned)
        working-directory: packages/desktop
        run: npx electron-builder --win --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: dev
          GITHUB_ACTIONS: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gloam-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: warn
