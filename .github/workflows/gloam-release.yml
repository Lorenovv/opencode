name: Gloam Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --ignore-scripts
      - name: Build binary
        run: bun build --compile --target=bun-windows-x64 packages/opencode/src/index.ts --outfile gloam-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gloam-windows-x64
          path: gloam-windows-x64.exe
