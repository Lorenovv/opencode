strategy:
  fail-fast: false
  matrix:
    include:
      - os: ubuntu-latest
        target: bun-linux-x64
        out: gloam-linux-x64
      - os: macos-latest
        target: bun-darwin-arm64
        out: gloam-macos-arm64
      - os: macos-13
        target: bun-darwin-x64
        out: gloam-macos-x64
      - os: windows-latest
        target: bun-windows-x64
        out: gloam-windows-x64.exe
